name: App checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Swift tests
        run: swift test --disable-sandbox
      - name: Launcher isolation tests
        run: bash Tests/Launcher/agent-launcher-test.sh
      - name: Package without installing
        run: bash Packaging/build-and-package.sh
      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: m4ix-cli-macos
          path: outputs/*.zip
          if-no-files-found: error
          retention-days: 14
